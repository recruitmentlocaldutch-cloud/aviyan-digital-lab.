<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>AVIYAN // SECURITY CORE</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#010207;
  color:#dffcff;
  font-family:"Courier New",monospace;
}

body{
  position:relative;
  background:
    radial-gradient(circle at 50% 45%,
      rgba(0,220,255,.12),
      transparent 28%),
    radial-gradient(circle at 15% 85%,
      rgba(100,0,255,.14),
      transparent 30%),
    radial-gradient(circle at 90% 10%,
      rgba(255,0,80,.08),
      transparent 25%),
    #010207;
}

/* DIGITAL GRID */

.grid{
  position:absolute;
  inset:-100px;

  background-image:
    linear-gradient(
      rgba(0,230,255,.05) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(0,230,255,.05) 1px,
      transparent 1px
    );

  background-size:45px 45px;

  transform:
    perspective(500px)
    rotateX(62deg)
    scale(1.6);

  transform-origin:center bottom;

  animation:gridMove 4s linear infinite;
}

@keyframes gridMove{
  from{background-position:0 0}
  to{background-position:0 45px}
}

/* SCANNER */

.scan{
  position:absolute;
  left:0;
  width:100%;
  height:2px;

  background:#00ffff;

  box-shadow:
    0 0 10px #00ffff,
    0 0 30px #00ffff;

  opacity:.55;

  animation:scan 3s linear infinite;

  z-index:20;
}

@keyframes scan{
  from{top:-5%}
  to{top:105%}
}

/* PARTICLES */

#particles{
  position:absolute;
  inset:0;
  z-index:2;
}

/* MAIN */

.interface{
  position:absolute;
  inset:0;
  z-index:5;
}

/* TOP */

.topbar{
  position:absolute;
  top:18px;
  left:18px;
  right:18px;

  display:flex;
  justify-content:space-between;

  font-size:9px;
  letter-spacing:2px;

  color:#56798b;
}

.online{
  color:#00ff9d;
  text-shadow:0 0 10px #00ff9d;
}

/* NAME */

.name{
  position:absolute;
  top:65px;
  width:100%;
  text-align:center;
}

.name small{
  font-size:8px;
  letter-spacing:5px;
  color:#48cce8;
}

.name h1{
  margin-top:8px;

  font-family:Arial,sans-serif;

  font-size:
    clamp(48px,15vw,100px);

  letter-spacing:
    clamp(7px,3vw,18px);

  color:#fff;

  text-shadow:
    0 0 8px #fff,
    0 0 25px #00eaff,
    0 0 60px #0077ff,
    0 0 100px #7000ff;
}

/* CENTER CORE */

.core{
  position:absolute;

  left:50%;
  top:41%;

  width:245px;
  height:245px;

  transform:translate(-50%,-50%);
}

/* RINGS */

.ring{
  position:absolute;
  inset:0;

  border-radius:50%;

  border:
    1px solid
    rgba(0,240,255,.5);

  box-shadow:
    0 0 25px
    rgba(0,230,255,.12);
}

.ring:nth-child(1){
  animation:rotate 6s linear infinite;
}

.ring:nth-child(2){
  inset:20px;

  border-color:
    rgba(120,50,255,.6);

  animation:
    rotateReverse 4s linear infinite;
}

.ring:nth-child(3){
  inset:43px;

  border:
    2px dashed
    rgba(0,255,210,.5);

  animation:
    rotate 2.8s linear infinite;
}

@keyframes rotate{
  to{
    transform:rotate(360deg);
  }
}

@keyframes rotateReverse{
  to{
    transform:rotate(-360deg);
  }
}

/* CORE */

.core-center{
  position:absolute;

  left:50%;
  top:50%;

  width:70px;
  height:70px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      white 0%,
      #00ffff 18%,
      #0066ff 45%,
      #07001b 75%
    );

  box-shadow:
    0 0 20px #00ffff,
    0 0 60px #008cff,
    0 0 110px #6200ff;

  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  50%{
    transform:
      translate(-50%,-50%)
      scale(1.15);
  }
}

/* RADAR */

.radar{
  position:absolute;

  left:50%;
  top:41%;

  width:285px;
  height:285px;

  transform:translate(-50%,-50%);

  border-radius:50%;

  border:
    1px solid
    rgba(0,255,200,.15);

  overflow:hidden;
}

.radar::before{
  content:"";

  position:absolute;

  left:50%;
  top:50%;

  width:50%;
  height:2px;

  transform-origin:left center;

  background:
    linear-gradient(
      90deg,
      rgba(0,255,180,.8),
      transparent
    );

  animation:
    radarSpin 2.5s linear infinite;
}

@keyframes radarSpin{
  to{
    transform:rotate(360deg);
  }
}

/* CODE STREAM */

.code{
  position:absolute;

  inset:0;

  overflow:hidden;

  opacity:.32;

  z-index:-1;
}

.column{
  position:absolute;

  top:-100%;

  color:#00eaff;

  font-size:9px;

  line-height:18px;

  text-shadow:
    0 0 8px #00eaff;

  white-space:pre;

  animation:
    codeFall linear infinite;
}

@keyframes codeFall{
  to{
    transform:
      translateY(220vh);
  }
}

/* TERMINAL */

.terminal{
  position:absolute;

  left:18px;
  right:18px;
  bottom:92px;

  height:190px;

  padding:16px;

  background:
    rgba(0,5,15,.82);

  border:
    1px solid
    rgba(0,230,255,.28);

  box-shadow:
    0 0 35px
    rgba(0,220,255,.08);

  backdrop-filter:blur(8px);

  overflow:hidden;
}

.terminal-title{
  font-size:8px;
  color:#557888;
  letter-spacing:2px;
  margin-bottom:10px;
}

#terminalText{
  color:#86ffe7;

  font-size:10px;

  line-height:1.65;

  white-space:pre-wrap;
}

/* STATUS */

.status{
  position:absolute;

  left:18px;
  right:18px;
  bottom:52px;

  display:flex;
  justify-content:space-between;

  color:#527284;

  font-size:7px;

  letter-spacing:1px;
}

.status b{
  color:#00ff9d;
}

/* PHASE */

.phase{
  position:absolute;

  top:51%;

  width:100%;

  text-align:center;

  color:#00eaff;

  font-size:9px;

  letter-spacing:3px;

  text-shadow:
    0 0 12px #00eaff;

  transition:.3s;
}

/* FINAL */

.final{
  position:absolute;

  inset:0;

  z-index:100;

  display:flex;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  background:
    radial-gradient(
      circle,
      rgba(0,220,255,.14),
      rgba(0,0,0,.98) 60%
    );

  opacity:0;

  transition:
    opacity 1.2s ease;

  pointer-events:none;
}

.final.show{
  opacity:1;
}

.final h2{
  font-family:Arial,sans-serif;

  font-size:
    clamp(58px,17vw,120px);

  letter-spacing:
    clamp(8px,4vw,22px);

  color:#fff;

  text-shadow:
    0 0 10px #fff,
    0 0 30px #00ffff,
    0 0 70px #0077ff,
    0 0 120px #7000ff;
}

.final p{
  margin-top:18px;

  font-size:9px;

  letter-spacing:4px;

  color:#7feeff;
}

.final .line{
  margin-top:25px;

  width:180px;
  height:1px;

  background:#00ffff;

  box-shadow:
    0 0 15px #00ffff;
}

/* GLITCH */

.glitch{
  animation:glitch .35s steps(2);
}

@keyframes glitch{
  0%{
    transform:translate(0);
  }
  25%{
    transform:translate(-7px,2px);
  }
  50%{
    transform:translate(8px,-2px);
  }
  75%{
    transform:translate(-3px,3px);
  }
  100%{
    transform:translate(0);
  }
}

</style>
</head>

<body>

<div class="grid"></div>

<div class="scan"></div>

<canvas id="particles"></canvas>

<div class="code" id="code"></div>


<div class="interface">

  <div class="topbar">

    <span>
      SECURITY CORE // AV-01
    </span>

    <span class="online">
      ● SECURE
    </span>

  </div>


  <div class="name">

    <small>
      CYBER SECURITY DEVELOPMENT LAB
    </small>

    <h1>
      AVIYAN
    </h1>

  </div>


  <div class="radar"></div>


  <div class="core">

    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>

    <div class="core-center"></div>

  </div>


  <div
    class="phase"
    id="phase">
    INITIALIZING SECURITY CORE
  </div>


  <div class="terminal">

    <div class="terminal-title">
      SECURE TERMINAL // LIVE OPERATIONS
    </div>

    <div id="terminalText"></div>

  </div>


  <div class="status">

    <span>
      NETWORK <b>SECURE</b>
    </span>

    <span>
      ENCRYPTION <b>ACTIVE</b>
    </span>

    <span>
      FIREWALL <b>ACTIVE</b>
    </span>

    <span>
      CORE <b>ONLINE</b>
    </span>

  </div>

</div>


<div
  class="final"
  id="final">

  <h2>AVIYAN</h2>

  <p>
    SECURITY CORE // ONLINE
  </p>

  <div class="line"></div>

  <p>
    CODE • SECURITY • ENGINEERING
  </p>

</div>


<script>

/* =====================================================
   CODE RAIN
===================================================== */

const codeBox =
  document.getElementById("code");

const snippets=[

`const securityCore = new SecurityEngine();

securityCore.initialize();
securityCore.encrypt();
securityCore.validate();

if(system.integrity === true){
    securityCore.authorize();
}`,

`$ security_scan
> initializing...
> analyzing network...
> verifying packets...
> integrity verified
> scan complete`,

`function protectSystem(){

  firewall.activate();

  encryption.enable();

  network.lock();

  return "SECURE";
}`,

`01001001 01010110
01001001 01011001
01000001 01001110`,

`const firewall = {
  status: "ACTIVE",
  integrity: 100,
  encryption: true,
  network: "SECURE"
};`,

`$ system_check

CPU .............. OK
MEMORY ........... OK
NETWORK .......... OK
ENCRYPTION ....... OK
FIREWALL ......... OK`,

`AUTHORIZATION

VERIFYING IDENTITY...
VERIFYING CORE...
VERIFYING INTEGRITY...

ACCESS GRANTED`
];

for(let i=0;i<15;i++){

  const c =
    document.createElement("div");

  c.className="column";

  c.style.left =
    Math.random()*100+"%";

  c.style.animationDuration =
    7+Math.random()*10+"s";

  c.style.animationDelay =
    -Math.random()*12+"s";

  c.textContent =
    snippets[
      Math.floor(
        Math.random()*snippets.length
      )
    ];

  codeBox.appendChild(c);

}


/* =====================================================
   PARTICLES
===================================================== */

const canvas =
  document.getElementById("particles");

const ctx =
  canvas.getContext("2d");

function resize(){

  canvas.width =
    innerWidth;

  canvas.height =
    innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);

const dots=[];

for(let i=0;i<90;i++){

  dots.push({

    x:Math.random()*innerWidth,

    y:Math.random()*innerHeight,

    vx:(Math.random()-.5)*.4,

    vy:(Math.random()-.5)*.4,

    r:Math.random()*1.5+.4

  });

}

function particles(){

  ctx.clearRect(
    0,0,
    canvas.width,
    canvas.height
  );

  dots.forEach((p,i)=>{

    p.x+=p.vx;
    p.y+=p.vy;

    if(p.x<0)p.x=innerWidth;
    if(p.x>innerWidth)p.x=0;

    if(p.y<0)p.y=innerHeight;
    if(p.y>innerHeight)p.y=0;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      p.r,
      0,
      Math.PI*2
    );

    ctx.fillStyle=
      "rgba(0,240,255,.75)";

    ctx.fill();

    for(
      let j=i+1;
      j<dots.length;
      j++
    ){

      const q=dots[j];

      const dx=p.x-q.x;
      const dy=p.y-q.y;

      const dist=
        Math.sqrt(
          dx*dx+dy*dy
        );

      if(dist<100){

        ctx.beginPath();

        ctx.moveTo(
          p.x,p.y
        );

        ctx.lineTo(
          q.x,q.y
        );

        ctx.strokeStyle=
          `rgba(
            0,
            180,
            255,
            ${(1-dist/100)*.12}
          )`;

        ctx.stroke();

      }

    }

  });

  requestAnimationFrame(
    particles
  );

}

particles();


/* =====================================================
   TERMINAL
===================================================== */

const terminal=
  document.getElementById(
    "terminalText"
  );

const phase=
  document.getElementById(
    "phase"
  );

const commands=[

"> SECURITY CORE INITIALIZING...",

"> loading cryptographic engine...",

"> firewall module activated ✓",

"> network topology discovered ✓",

"> encrypted channel established ✓",

"> scanning system integrity...",

"> analyzing security packets...",

"> checking authorization layer...",

"> threat analysis complete ✓",

"> threats detected: 00",

"> encryption integrity: 100%",

"> firewall status: ACTIVE",

"> network status: SECURE",

"> security verification complete ✓",

"> deploying security configuration...",

"> operation complete ✓",

"> AVIYAN SECURITY CORE ONLINE"

];

let index=0;
let char=0;

function typeCommand(){

  if(index>=commands.length){

    setTimeout(()=>{

      terminal.innerHTML="";
      index=0;
      char=0;

      typeCommand();

    },1200);

    return;

  }

  const text=
    commands[index];

  if(char<text.length){

    terminal.innerHTML+=
      text[char];

    char++;

    setTimeout(
      typeCommand,
      16
    );

  }else{

    terminal.innerHTML+="<br>";

    index++;
    char=0;

    setTimeout(
      typeCommand,
      180
    );

  }

}

typeCommand();


/* =====================================================
   45 SECOND CINEMATIC TIMELINE
===================================================== */

const timeline=[

  {
    time:0,
    text:"SECURITY CORE INITIALIZING"
  },

  {
    time:7,
    text:"NETWORK TOPOLOGY DISCOVERY"
  },

  {
    time:14,
    text:"SOURCE CODE SECURITY ANALYSIS"
  },

  {
    time:21,
    text:"THREAT DETECTION // SCANNING"
  },

  {
    time:28,
    text:"ENCRYPTION ENGINE ACTIVE"
  },

  {
    time:35,
    text:"FIREWALL INTEGRITY VERIFIED"
  },

  {
    time:41,
    text:"SECURITY CORE AUTHORIZED"
  }

];

let start=
  performance.now();

function cinematic(){

  const elapsed=
    (performance.now()-start)/1000;

  let current=
    timeline[0];

  timeline.forEach(item=>{

    if(elapsed>=item.time){
      current=item;
    }

  });

  phase.textContent=
    current.text;

  if(
    elapsed>41 &&
    elapsed<45
  ){

    document
      .getElementById("final")
      .classList.add("show");

  }

  if(elapsed>44.5){

    document
      .getElementById("final")
      .classList.remove("show");

    document.body.classList.add(
      "glitch"
    );

    setTimeout(()=>{

      document.body.classList.remove(
        "glitch"
      );

    },350);

    start=
      performance.now();

  }

  requestAnimationFrame(
    cinematic
  );

}

cinematic();

</script>

</body>
</html>
