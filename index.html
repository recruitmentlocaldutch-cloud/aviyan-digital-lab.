<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>AVIYAN // CORE</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#00030a;
    font-family:"Courier New",monospace;
    color:#dffcff;
}

body{
    position:relative;
}

/* =====================================================
   BACKGROUND
===================================================== */

.bg{
    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(0,220,255,.12),
            transparent 28%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(80,0,255,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(0,255,220,.08),
            transparent 25%
        ),
        #00030a;
}

/* GRID */

.grid{
    position:absolute;
    inset:-100px;

    background-image:
        linear-gradient(
            rgba(0,220,255,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,220,255,.055) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(62deg)
        scale(1.5);

    transform-origin:center bottom;

    animation:gridMove 5s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:0 55px;
    }

}

/* =====================================================
   SCANLINE
===================================================== */

.scan{
    position:absolute;

    width:100%;
    height:3px;

    background:#00ffff;

    box-shadow:
        0 0 10px #00ffff,
        0 0 35px #00ffff;

    opacity:.5;

    animation:scan 3s linear infinite;

    z-index:20;
}

@keyframes scan{

    0%{
        top:-5%;
    }

    100%{
        top:105%;
    }

}

/* =====================================================
   PARTICLES
===================================================== */

#particles{
    position:absolute;
    inset:0;
    z-index:2;
}

/* =====================================================
   MAIN
===================================================== */

.interface{
    position:absolute;

    inset:0;

    z-index:5;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:
        25px
        25px
        30px;

}

/* =====================================================
   TOP BAR
===================================================== */

.top{

    width:100%;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:10px;

    letter-spacing:2px;

    color:#5a8296;

}

.top .online{

    color:#00ffae;

    text-shadow:
        0 0 10px #00ffae;

}

/* =====================================================
   TITLE
===================================================== */

.brand{

    margin-top:65px;

    text-align:center;

    z-index:8;

}

.brand small{

    color:#00d9ff;

    letter-spacing:6px;

    font-size:10px;

}

.brand h1{

    margin-top:8px;

    font-family:Arial,sans-serif;

    font-size:
        clamp(48px,15vw,100px);

    letter-spacing:
        clamp(8px,3vw,20px);

    font-weight:900;

    color:white;

    text-shadow:

        0 0 8px #fff,

        0 0 20px #00eaff,

        0 0 50px #008cff,

        0 0 90px #6a00ff;

    animation:
        flicker 4s infinite;

}

@keyframes flicker{

    0%,95%,100%{
        opacity:1;
    }

    96%{
        opacity:.45;
    }

    97%{
        opacity:1;
    }

}

/* =====================================================
   DIGITAL CORE
===================================================== */

.core{

    position:absolute;

    top:39%;

    left:50%;

    transform:
        translate(-50%,-50%);

    width:270px;

    height:270px;

}

.ring{

    position:absolute;

    inset:0;

    border-radius:50%;

    border:
        1px solid rgba(0,230,255,.55);

    box-shadow:
        0 0 30px rgba(0,220,255,.15);

}

.ring:nth-child(1){

    animation:
        rotate 7s linear infinite;

}

.ring:nth-child(2){

    inset:18px;

    border-color:
        rgba(120,60,255,.65);

    animation:
        rotateReverse 5s linear infinite;

}

.ring:nth-child(3){

    inset:38px;

    border:
        2px dashed
        rgba(0,255,220,.45);

    animation:
        rotate 3s linear infinite;

}

.ring::before,
.ring::after{

    content:"";

    position:absolute;

    width:8px;

    height:8px;

    border-radius:50%;

    background:#00ffff;

    box-shadow:
        0 0 15px #00ffff,
        0 0 35px #00ffff;

}

.ring::before{

    top:-4px;

    left:50%;

}

.ring::after{

    bottom:-4px;

    right:50%;

}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }

}

@keyframes rotateReverse{

    from{
        transform:rotate(360deg);
    }

    to{
        transform:rotate(0deg);
    }

}

.core-center{

    position:absolute;

    top:50%;
    left:50%;

    transform:
        translate(-50%,-50%);

    width:90px;
    height:90px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #ffffff,
            #00ffff 15%,
            #0077ff 45%,
            #08001c 75%
        );

    box-shadow:

        0 0 20px #00ffff,

        0 0 60px #008cff,

        0 0 110px #5d00ff;

    animation:
        pulse 1.5s infinite;

}

@keyframes pulse{

    0%,100%{
        transform:
            translate(-50%,-50%)
            scale(1);
    }

    50%{
        transform:
            translate(-50%,-50%)
            scale(1.12);
    }

}

/* =====================================================
   CODE STREAM
===================================================== */

.code-stream{

    position:absolute;

    top:28%;

    left:0;

    width:100%;

    height:45%;

    overflow:hidden;

    opacity:.5;

    z-index:-1;

}

.code-column{

    position:absolute;

    top:-100%;

    white-space:pre;

    font-size:10px;

    line-height:18px;

    color:#00eaff;

    text-shadow:
        0 0 8px #00eaff;

    animation:
        fall linear infinite;

}

@keyframes fall{

    to{
        transform:
            translateY(250vh);
    }

}

/* =====================================================
   TERMINAL
===================================================== */

.terminal{

    position:absolute;

    left:25px;

    right:25px;

    bottom:125px;

    height:205px;

    border:
        1px solid
        rgba(0,230,255,.25);

    background:
        rgba(0,5,14,.72);

    backdrop-filter:
        blur(8px);

    box-shadow:
        0 0 35px
        rgba(0,200,255,.08);

    padding:18px;

    overflow:hidden;

}

.terminal-head{

    color:#55798c;

    font-size:9px;

    letter-spacing:2px;

    margin-bottom:12px;

}

#terminalText{

    color:#8fffe8;

    font-size:11px;

    line-height:1.7;

    white-space:pre-wrap;

}

.cursor{

    display:inline-block;

    width:7px;

    height:12px;

    background:#00ffff;

    box-shadow:
        0 0 10px #00ffff;

    animation:
        blink .8s infinite;

}

@keyframes blink{

    50%{
        opacity:0;
    }

}

/* =====================================================
   STATUS
===================================================== */

.status{

    position:absolute;

    left:25px;
    right:25px;

    bottom:70px;

    display:flex;

    justify-content:
        space-between;

    font-size:8px;

    letter-spacing:1px;

    color:#557486;

}

.status span{

    color:#00ffae;

}

/* =====================================================
   FINAL
===================================================== */

.final{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:
        radial-gradient(
            circle,
            rgba(0,240,255,.12),
            rgba(0,0,0,.97) 55%
        );

    opacity:0;

    pointer-events:none;

    z-index:50;

    transition:
        opacity 1s ease;

}

.final.show{

    opacity:1;

}

.final h2{

    font-family:Arial,sans-serif;

    font-size:
        clamp(58px,17vw,120px);

    letter-spacing:
        clamp(8px,4vw,25px);

    color:white;

    text-shadow:

        0 0 10px #fff,

        0 0 30px #00ffff,

        0 0 70px #008cff,

        0 0 120px #7000ff;

}

.final p{

    margin-top:18px;

    font-size:11px;

    letter-spacing:5px;

    color:#7eeeff;

}

/* =====================================================
   GLITCH
===================================================== */

.glitch{

    animation:
        glitch .25s steps(2);

}

@keyframes glitch{

    0%{
        transform:translate(0);
    }

    25%{
        transform:translate(-8px,3px);
    }

    50%{
        transform:translate(8px,-3px);
    }

    75%{
        transform:translate(-4px,-2px);
    }

    100%{
        transform:translate(0);
    }

}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:600px){

    .interface{
        padding:18px;
    }

    .brand{
        margin-top:50px;
    }

    .core{
        top:38%;
        width:245px;
        height:245px;
    }

    .terminal{
        left:18px;
        right:18px;
        bottom:105px;
        height:185px;
    }

    .status{
        left:18px;
        right:18px;
        bottom:48px;
    }

}

</style>
</head>

<body>

<div class="bg"></div>

<div class="grid"></div>

<div class="scan"></div>

<canvas id="particles"></canvas>

<div class="code-stream" id="codeStream"></div>


<div class="interface">

    <div class="top">

        <div>
            AV // CORE-01
        </div>

        <div class="online">
            ● SYSTEM ONLINE
        </div>

    </div>


    <div class="brand">

        <small>
            DIGITAL DEVELOPMENT ENVIRONMENT
        </small>

        <h1>
            AVIYAN
        </h1>

    </div>


    <div class="core">

        <div class="ring"></div>

        <div class="ring"></div>

        <div class="ring"></div>

        <div class="core-center"></div>

    </div>


    <div class="terminal">

        <div class="terminal-head">
            TERMINAL // LIVE DEVELOPMENT SESSION
        </div>

        <div id="terminalText"></div>

        <span class="cursor"></span>

    </div>


    <div class="status">

        <div>
            CPU <span>ONLINE</span>
        </div>

        <div>
            NETWORK <span>LINKED</span>
        </div>

        <div>
            CODE <span>ACTIVE</span>
        </div>

        <div>
            BUILD <span>100%</span>
        </div>

    </div>

</div>


<div class="final" id="final">

    <h2>AVIYAN</h2>

    <p>
        DEVELOPER // SYSTEM ONLINE
    </p>

</div>


<script>

/* =====================================================
   CODE RAIN
===================================================== */

const codeStream =
    document.getElementById("codeStream");

const snippets = [

`const developer = "AVIYAN";
async function buildFuture(){
await compile();
return deploy();
}`,

`git status
git add .
git commit -m "build core"
git push origin main`,

`function create(){
const idea = new System();
idea.compile();
idea.deploy();
}`,

`01001001 01010110
01001001 01011001
01000001 01001110`,

`<system>
<core>ONLINE</core>
<code>ACTIVE</code>
<network>LINKED</network>
</system>`,

`const system = {
status:"ONLINE",
mode:"DEVELOPMENT",
engine:"ACTIVE"
};`

];

for(let i=0;i<12;i++){

    const col =
        document.createElement("div");

    col.className="code-column";

    col.style.left =
        (Math.random()*100)+"%";

    col.style.animationDuration =
        (7+Math.random()*10)+"s";

    col.style.animationDelay =
        (-Math.random()*10)+"s";

    col.textContent =
        snippets[
            Math.floor(
                Math.random()*snippets.length
            )
        ];

    codeStream.appendChild(col);

}


/* =====================================================
   PARTICLE ENGINE
===================================================== */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

function resize(){

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

resize();

window.addEventListener(
    "resize",
    resize
);

const dots=[];

for(let i=0;i<100;i++){

    dots.push({

        x:Math.random()*innerWidth,

        y:Math.random()*innerHeight,

        vx:(Math.random()-.5)*.35,

        vy:(Math.random()-.5)*.35,

        r:Math.random()*1.7+.4

    });

}

function particleLoop(){

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    dots.forEach((p,i)=>{

        p.x+=p.vx;
        p.y+=p.vy;

        if(p.x<0)p.x=innerWidth;
        if(p.x>innerWidth)p.x=0;

        if(p.y<0)p.y=innerHeight;
        if(p.y>innerHeight)p.y=0;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI*2
        );

        ctx.fillStyle =
            "rgba(0,230,255,.75)";

        ctx.fill();

        for(let j=i+1;j<dots.length;j++){

            const q=dots[j];

            const dx=p.x-q.x;
            const dy=p.y-q.y;

            const dist =
                Math.sqrt(dx*dx+dy*dy);

            if(dist<110){

                ctx.beginPath();

                ctx.moveTo(
                    p.x,p.y
                );

                ctx.lineTo(
                    q.x,q.y
                );

                ctx.strokeStyle =
                    `rgba(0,180,255,${(
                        1-dist/110
                    )*.12})`;

                ctx.stroke();

            }

        }

    });

    requestAnimationFrame(
        particleLoop
    );

}

particleLoop();


/* =====================================================
   TERMINAL TYPING
===================================================== */

const terminal =
    document.getElementById(
        "terminalText"
    );

const commands=[

"> initializing core...",
"> loading developer environment...",
"> detecting source code...",
"> source code detected ✓",
"> connecting to development engine...",
"> connection established ✓",
"> compiling modules...",
"> running system diagnostics...",
"> all systems operational ✓",
"> preparing deployment...",
"> build completed ✓",
"> AVIYAN // CORE ONLINE"

];

let commandIndex=0;

let characterIndex=0;

function typeTerminal(){

    if(commandIndex>=commands.length){

        setTimeout(()=>{

            terminal.innerHTML="";

            commandIndex=0;

            characterIndex=0;

            typeTerminal();

        },2500);

        return;

    }

    const current =
        commands[commandIndex];

    if(characterIndex<
       current.length){

        terminal.innerHTML +=
            current[characterIndex];

        characterIndex++;

        setTimeout(
            typeTerminal,
            18
        );

    }else{

        terminal.innerHTML +=
            "<br>";

        commandIndex++;

        characterIndex=0;

        setTimeout(
            typeTerminal,
            250
        );

    }

}

typeTerminal();


/* =====================================================
   CINEMATIC FINAL REVEAL
===================================================== */

setTimeout(()=>{

    document.body.classList.add(
        "glitch"
    );

},11000);

setTimeout(()=>{

    document
        .getElementById("final")
        .classList.add("show");

},12000);


/* RESTART CINEMATIC */

setTimeout(()=>{

    document
        .getElementById("final")
        .classList.remove("show");

    document.body.classList.remove(
        "glitch"
    );

},17000);

</script>

</body>
</html>
